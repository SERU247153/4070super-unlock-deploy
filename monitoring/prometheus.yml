# 16_monitoring.sh — Prometheus 스크레이프 설정
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: nvidia_gpu_exporter
    static_configs: [{ targets: ["gpu-exporter:9835"] }]
  - job_name: dcgm
    static_configs: [{ targets: ["dcgm-exporter:9400"] }]   # dcgm 프로필을 켠 경우에만 UP
  - job_name: vllm
    metrics_path: /metrics
    static_configs: [{ targets: ["llm-serve:8000"] }]        # 17_serve.sh 서빙 중일 때만 UP (vLLM/SGLang /metrics)
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
