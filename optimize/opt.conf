#!/usr/bin/env bash
# ============================================================
# 최적화 키트 공통 설정 — 이 파일만 수정하면 됩니다.
# 모든 스크립트가 source 로 읽습니다.
# shellcheck disable=SC2034
# ============================================================

# ---- 대상 컨테이너 ----
CONTAINER="jupyter_ai"            # 주피터가 올라가 있는 컨테이너 이름

# ---- 호스트 (10_host.sh) ----
POWER_CAP_W=180                    # 부팅마다 자동 적용할 전력 제한 (실측 스위트 스팟 180W)
OLLAMA_TUNE=1                      # Ollama FlashAttention + KV 캐시 양자화
OLLAMA_KV_CACHE_TYPE="q8_0"        # f16 | q8_0 | q4_0 (q8_0: VRAM 절반, 품질 손실 미미)
PROFILING_FOR_ALL=1                # 컨테이너 안에서 Nsight Compute 사용 허용 (다음 콜드 부팅부터 반영)
MONITOR_ENABLE=1                   # GPU 모니터링 스택 (exporter + Prometheus + Grafana)
GRAFANA_PORT=3001                  # open-webui 가 3000 을 쓰는 경우가 많아 3001 사용

# ---- 컨테이너 (20_container.sh) ----
HF_PERSIST_DIR=""                  # 비우면 컨테이너의 영구 마운트를 자동 탐지해 HF 캐시를 그 안에 둠
PIP_PROFILE="pinned"               # pinned: torch 2.4(NGC 24.07) 호환 검증 버전 / latest: 최신 시도
INSTALL_ORT=1                      # ONNX Runtime GPU (TensorRT EP)
INSTALL_DALI=1                     # NVIDIA DALI (이미 있으면 건너뜀)
INSTALL_DEEPSPEED=0                # ZeRO-Offload 용 (빌드가 무거워 기본 off)
COMMIT_IMAGE=1                     # 작업 후 docker commit 으로 이미지 보존
RESTART_CONTAINER=0                # 1이면 nvdashboard 활성화를 위해 컨테이너 재시작 (실행 중 커널 종료됨)

# ---- 서빙 (30_serving.sh, 필요할 때만 수동 기동) ----
VLLM_IMAGE="vllm/vllm-openai:v0.6.3"
VLLM_MODEL="Qwen/Qwen2.5-7B-Instruct-AWQ"   # 4비트 AWQ — 12GB 에서 서빙 가능
VLLM_PORT=8000
VLLM_GPU_UTIL=0.80                 # vLLM 이 선점할 VRAM 비율 (주피터와 동시 사용 시 낮출 것)
VLLM_MAX_LEN=8192
SGLANG_IMAGE="lmsysorg/sglang:latest"   # 사용 전 버전 태그 고정 권장
SGLANG_PORT=30000
